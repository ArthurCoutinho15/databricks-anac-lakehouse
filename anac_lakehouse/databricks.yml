# This is a Declarative Automation Bundle definition for anac_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: anac_lakehouse
  uuid: 9085111f-27dc-49ae-ae66-d025ee0df131

include:
  - resources/**/*.yml

artifacts:
  anac_lakehouse:
    type: whl
    build: uv build --wheel
    path: .

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: anac
  schema:
    description: The schema to use
  source_root:
    description: The workspace path containing the deployed source code

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-fcdc542c-133d.cloud.databricks.com
    variables:
      catalog: anac
      schema: ${workspace.current_user.short_name}
      source_root: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/src
  prod:
    mode: production
    workspace:
      host: https://dbc-fcdc542c-133d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/arthurtelescoutinho@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/arthurtelescoutinho@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: anac
      schema: prod
      source_root: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/src
    permissions:
      - user_name: arthurtelescoutinho@gmail.com
        level: CAN_MANAGE
