resources:
  jobs:
    our_airports_etl_job:
      name: our_airports_etl_job
      tasks:
        - task_key: bronze_ourairports
          environment_key: default
          python_wheel_task:
            package_name: anac_lakehouse
            entry_point: ourairports_bronze
            parameters:
              - ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
