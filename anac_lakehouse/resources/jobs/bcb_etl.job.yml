resources:
  jobs:
    bcb_etl_job:
      name: bcb_etl_job
      tasks:
        - task_key: bronze_bcb
          environment_key: default
          python_wheel_task:
            package_name: anac_lakehouse
            entry_point: bcb_bronze
            parameters:
              - ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
