resources:
  jobs:
    open_meteo_etl_job:
      name: open_meteo_etl_job
      tasks:
        - task_key: bronze_open_meteo
          environment_key: default
          python_wheel_task:
            package_name: anac_lakehouse
            entry_point: open_meteo_bronze
            parameters:
              - ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
