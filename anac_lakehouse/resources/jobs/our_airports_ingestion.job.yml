resources:
  jobs:
    our_airports_ingestion_job:
      name: our_airports_ingestion_job
      tasks:
        - task_key: ingest_our_airports
          environment_key: default
          python_wheel_task:
            package_name: anac_lakehouse
            entry_point: ingest_our_airports
            parameters:
              - ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
