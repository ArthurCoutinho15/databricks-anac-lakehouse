resources:
  jobs:
    open_meteo_ingestion_job:
      name: open_meteo_ingestion_job
      tasks:
        - task_key: ingest_open_meteo
          environment_key: default
          python_wheel_task:
            package_name: anac_lakehouse
            entry_point: ingest_open_meteo
            parameters:
              - ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../../dist/*.whl
